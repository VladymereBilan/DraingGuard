; DrainGuard firmware - PlatformIO project
;
; Environments
;   esp32   real hardware (ESP32 DevKit v1)
;   wokwi   same build as esp32 plus -DDG_WOKWI=1 (simulator Wi-Fi, no hardware dividers)
;   native  host build for pure-logic unit tests in lib/dg_core (no Arduino.h)
;
; legacy/ holds the v0.2 Wokwi prototype. It sits outside src/, lib/, include/ and test/,
; so PlatformIO never compiles it.

[platformio]
default_envs = esp32

[esp32_base]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Arduino core 2.0.17 compiles C++ as gnu++11; drop that and ask for gnu++17 so
; include/ and lib/dg_core build identically on the ESP32 and on the host (D20).
build_unflags = -std=gnu++11
build_flags = -Wall -Wextra -std=gnu++17

[env:esp32]
extends = esp32_base

[env:wokwi]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	-DDG_WOKWI=1
	; Enables the "net off" / "net on" serial commands so the offline buffer can
	; be exercised in the simulator. Never set on the hardware build (D55).
	-DDG_NET_DEBUG=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DDG_NATIVE=1
; src/ is hardware code and needs Arduino.h, so the host build never compiles it.
build_src_filter = -<*>
